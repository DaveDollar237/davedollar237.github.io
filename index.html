
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toits en Course</title>
<style>
:root{--bg:#1b1442;--sun:#ff7a3d;--teal:#2de1c2;--ink:#fff4e6;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#g{position:relative;height:100%;width:100%}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;top:12px;font-weight:800;font-size:22px;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#sc{left:16px}#cn{right:16px;color:#ffd35c}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,12,50,.74);text-align:center;padding:24px}
.ov.off{display:none}
h1{margin:0;font-size:44px;line-height:1;font-weight:900;letter-spacing:-1px;color:var(--sun);text-shadow:0 3px 0 #7a2a10}
p{margin:0;max-width:300px;line-height:1.4;font-size:16px}
button{background:var(--sun);color:#1b1442;border:0;border-radius:14px;padding:14px 38px;font:800 20px system-ui,sans-serif;cursor:pointer;box-shadow:0 4px 0 #a8421a}
button:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #a8421a}
.big{font-size:56px;font-weight:900}
.ad{width:300px;max-width:90%;min-height:100px;border:1px dashed rgba(255,244,230,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:13px;opacity:.7}
</style>
</head>
<body>
<div id="g">
<canvas id="c"></canvas>
<div class="hud" id="sc">0</div>
<div class="hud" id="cn">0 pièces</div>

<div class="ov" id="menu">
<h1>Toits en Course</h1>
<p>Glisse à gauche ou à droite pour changer de voie, vers le haut pour sauter, vers le bas pour te glisser sous les barres.</p>
<button id="go">Jouer</button>
<div class="ad">Espace publicitaire</div>
</div>

<div class="ov off" id="over">
<h1>Perdu !</h1>
<div class="big" id="fs">0</div>
<p id="fb">Record : 0</p>
<button id="re">Rejouer</button>
<div class="ad">Espace publicitaire</div>
</div>
</div>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var cv=$('c'),x=cv.getContext('2d');
var W,H,LW,hz,py,pB;
function rs(){var d=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=W*d;cv.height=H*d;x.setTransform(d,0,0,d,0,0);LW=Math.min(W/3.4,150);hz=H*.3;py=H*.82;pB=(H-hz)/(py-hz)}
addEventListener('resize',rs);rs();

var run=false,lane=0,px=0,jy=0,vy=0,slide=0,sp=18,dist=0,coins=0,objs=[],rowZ=60,best=0,last=0;
try{best=+localStorage.getItem('tr_best')||0}catch(e){}

var sky=[];for(var i=0;i<16;i++)sky.push({w:30+Math.random()*50,h:30+Math.random()*90});

function P(z){return 1/(1+z/9)}
function Y(p){return hz+(py-hz)*p}
function X(l,p){return W/2+l*LW*p}

function spawn(){
  var free=Math.floor(Math.random()*3)-1;
  for(var l=-1;l<=1;l++){
    if(l===free){if(Math.random()<.7)for(var i=0;i<4;i++)objs.push({t:'c',l:l,z:rowZ+i*2.2,len:0});continue}
    var r=Math.random();
    if(r<.4)objs.push({t:'b',l:l,z:rowZ,len:1});
    else if(r<.65)objs.push({t:'o',l:l,z:rowZ,len:1});
    else if(r<.9)objs.push({t:'t',l:l,z:rowZ,len:7+(Math.random()*5|0)});
  }
  rowZ+=21+Math.random()*10;
}

function begin(){
  lane=0;px=0;jy=0;vy=0;slide=0;sp=18;dist=0;coins=0;objs=[];rowZ=60;run=true;last=performance.now();
  $('menu').classList.add('off');$('over').classList.add('off');
}
function die(){
  run=false;
  var s=Math.floor(dist)+coins*10;
  if(s>best){best=s;try{localStorage.setItem('tr_best',best)}catch(e){}}
  $('fs').textContent=s;$('fb').textContent='Record : '+best;
  $('over').classList.remove('off');
}
function moveL(d){if(!run)return;lane=Math.max(-1,Math.min(1,lane+d))}
function jump(){if(run&&jy<=0.01){vy=9;slide=0}}
function dive(){if(!run)return;if(jy>0.01)vy=-22;else slide=.6}

addEventListener('keydown',function(e){
  if(e.key==='ArrowLeft')moveL(-1);
  else if(e.key==='ArrowRight')moveL(1);
  else if(e.key==='ArrowUp'||e.key===' ')jump();
  else if(e.key==='ArrowDown')dive();
});
var sx=0,sy=0,sd=false;
cv.addEventListener('pointerdown',function(e){sx=e.clientX;sy=e.clientY;sd=true});
cv.addEventListener('pointerup',function(e){
  if(!sd)return;sd=false;
  var dx=e.clientX-sx,dy=e.clientY-sy;
  if(Math.abs(dx)<24&&Math.abs(dy)<24)return;
  if(Math.abs(dx)>Math.abs(dy))moveL(dx>0?1:-1);else if(dy<0)jump();else dive();
});
$('go').onclick=begin;$('re').onclick=begin;

function update(dt){
  sp=Math.min(38,sp+dt*.25);
  dist+=sp*dt*.5;
  px+=(lane-px)*Math.min(1,dt*14);
  if(jy>0||vy>0){jy+=vy*dt;vy-=28*dt;if(jy<=0){jy=0;vy=0}}
  if(slide>0)slide-=dt;
  rowZ-=sp*dt;if(rowZ<90)spawn();
  for(var i=0;i<objs.length;i++){
    var o=objs[i];o.z-=sp*dt;
    if(Math.abs(o.l-px)<.55&&o.z<.5&&o.z+o.len>-.5){
      if(o.t==='c'){if(!o.d){o.d=1;coins++}}
      else if(o.t==='b'){if(jy<.75)die()}
      else if(o.t==='o'){if(slide<=0)die()}
      else die();
    }
  }
  objs=objs.filter(function(o){return o.z+o.len>-3&&!o.d});
  $('sc').textContent=Math.floor(dist)+coins*10;
  $('cn').textContent=coins+' pièces';
}

function rect(cx,base,w,h,c){x.fillStyle=c;x.fillRect(cx-w/2,base-h,w,h)}

function drawObj(o){
  var p=P(Math.max(o.z,-.2)),U=LW*.8,cx=X(o.l,p),b=Y(p);
  x.globalAlpha=Math.max(0,Math.min(1,(95-o.z)/25));
  if(o.t==='c'){
    x.fillStyle='#ffd35c';x.beginPath();x.arc(cx,b-.5*U*p,.2*U*p,0,7);x.fill();
    x.fillStyle='#e0a418';x.beginPath();x.arc(cx,b-.5*U*p,.1*U*p,0,7);x.fill();
  }else if(o.t==='b'){
    var w=.9*LW*p,h=.7*U*p;
    rect(cx,b,w,h,'#fff4e6');
    x.fillStyle='#ff7a3d';
    for(var k=0;k<4;k++)x.fillRect(cx-w/2+k*w/4,b-h,w/8,h);
  }else if(o.t==='o'){
    var w2=.9*LW*p,pp=.08*LW*p;
    rect(cx-w2/2+pp/2,b,pp,1.7*U*p,'#6d5fc7');
    rect(cx+w2/2-pp/2,b,pp,1.7*U*p,'#6d5fc7');
    x.fillStyle='#2de1c2';x.fillRect(cx-w2/2,b-1.05*U*p,w2,.5*U*p);
    x.fillStyle='#1b1442';x.fillRect(cx-w2/2,b-.82*U*p,w2,.07*U*p);
  }else{
    var p2=P(Math.max(o.z+o.len,0)),w3=.92*LW,hh=1.5*U;
    var xb=X(o.l,p2),yb=Y(p2);
    x.fillStyle='#4a3fa0';
    x.beginPath();
    x.moveTo(cx-w3*p/2,b-hh*p);x.lineTo(cx+w3*p/2,b-hh*p);
    x.lineTo(xb+w3*p2/2,yb-hh*p2);x.lineTo(xb-w3*p2/2,yb-hh*p2);x.fill();
    rect(cx,b,w3*p,hh*p,'#6d5fc7');
    x.fillStyle='#ffd35c';x.fillRect(cx-w3*p*.38,b-hh*p*.78,w3*p*.76,hh*p*.22);
    x.fillStyle='#1b1442';x.fillRect(cx-w3*p*.38,b-hh*p*.7,w3*p*.76,hh*p*.04);
  }
  x.globalAlpha=1;
}

function drawPlayer(){
  var U=LW*.8,cx=X(px,1),gy=py-jy*U,s=slide>0&&jy<=0.01,ph=dist*2;
  x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.ellipse(cx,py,LW*.28*(1-Math.min(jy,1.4)*.25),LW*.07,0,0,7);x.fill();
  var bh=s?.4*U:.62*U;
  var leg=Math.sin(ph*3)*.12*U*(jy>0?0:1);
  x.fillStyle='#22207a';
  x.fillRect(cx-.16*U+leg,gy-.22*U,.13*U,.22*U);
  x.fillRect(cx+.03*U-leg,gy-.22*U,.13*U,.22*U);
  x.fillStyle='#2de1c2';
  x.beginPath();x.roundRect?x.roundRect(cx-.24*U,gy-.22*U-bh,.48*U,bh,.12*U):x.rect(cx-.24*U,gy-.22*U-bh,.48*U,bh);x.fill();
  var hy=gy-.22*U-bh-.14*U;
  x.fillStyle='#fff4e6';x.beginPath();x.arc(cx,hy,.2*U,0,7);x.fill();
  x.fillStyle='#1b1442';x.fillRect(cx-.15*U,hy-.05*U,.3*U,.09*U);
  x.fillStyle='#ff7a3d';
  x.fillRect(cx-.22*U,hy+.17*U,.44*U,.08*U);
  var fl=Math.sin(ph*4)*.05*U;
  x.beginPath();x.moveTo(cx-.2*U,hy+.17*U);x.lineTo(cx-.55*U,hy+.1*U+fl);x.lineTo(cx-.5*U,hy+.3*U+fl);x.lineTo(cx-.2*U,hy+.25*U);x.fill();
}

function draw(){
  var g=x.createLinearGradient(0,0,0,hz);
  g.addColorStop(0,'#1b1442');g.addColorStop(1,'#ff7a3d');
  x.fillStyle=g;x.fillRect(0,0,W,hz+2);
  x.fillStyle='#ffd35c';x.beginPath();x.arc(W*.72,hz-26,34,0,7);x.fill();
  var bx=0,i=0;
  x.fillStyle='#2a1d66';
  while(bx<W){var b=sky[i%sky.length];x.fillRect(bx,hz-b.h,b.w,b.h);bx+=b.w+4;i++}
  x.fillStyle='#14102f';x.fillRect(0,hz,W,H-hz);
  var cx=W/2,e=.02;
  x.fillStyle='#2b2260';
  x.beginPath();x.moveTo(cx-1.5*LW*e,hz);x.lineTo(cx+1.5*LW*e,hz);x.lineTo(cx+1.5*LW*pB,H);x.lineTo(cx-1.5*LW*pB,H);x.fill();
  x.strokeStyle='rgba(45,225,194,.5)';x.lineWidth=2;
  [-1.5,-.5,.5,1.5].forEach(function(k){
    x.beginPath();x.moveTo(cx+k*LW*e,hz);x.lineTo(cx+k*LW*pB,H);x.stroke();
  });
  x.strokeStyle='rgba(255,244,230,.16)';
  for(var z=-(dist*2%5);z<95;z+=5){
    if(z<0)continue;
    var p=P(z),y=Y(p),w=1.5*LW*p;
    x.lineWidth=2*p+.5;x.beginPath();x.moveTo(cx-w,y);x.lineTo(cx+w,y);x.stroke();
  }
  var arr=objs.slice().sort(function(a,b){return b.z-a.z});
  var drawn=false;
  for(var k=0;k<arr.length;k++){
    if(!drawn&&arr[k].z<0){drawPlayer();drawn=true}
    drawObj(arr[k]);
  }
  if(!drawn)drawPlayer();
}

function loop(t){
  var dt=Math.min(.05,(t-last)/1000);last=t;
  if(run)update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(function(t){last=t;loop(t)});
})();
</script>
</body>
</html>
